<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05070f" />
    <meta
      name="description"
      content="Pixel Rush - a concept-agnostic Phaser 4 and Vite web game scaffold with a playable placeholder run."
    />
    <title>Pixel Rush - Phaser 4 Scaffold</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2305070f'/%3E%3Crect x='8' y='8' width='16' height='16' rx='5' fill='%2338e8ff'/%3E%3Crect x='13' y='13' width='6' height='6' rx='2' fill='%2305070f'/%3E%3C/svg%3E"
    />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #05070f;
      }
      #game-container {
        position: fixed;
        inset: 0;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        clip-path: inset(50%);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <div id="game-container"></div>

    <p id="game-instructions" class="sr-only">
      Pixel Rush is a sixty second placeholder run. Move with the arrow keys, W A S D, or by
      dragging on the canvas. Collect gold diamonds to score. Press Escape to pause. In menus,
      press Enter or Space to confirm.
    </p>
    <p id="a11y-status" class="sr-only" role="status" aria-live="polite"></p>

    <noscript>
      <p class="noscript">This game needs JavaScript enabled.</p>
    </noscript>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
