# Netlify build configuration.
# Deploying is a separate, explicitly approved action. This file only defines
# what Netlify should run when the repository is connected.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
